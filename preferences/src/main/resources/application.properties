spring.application.name=preferences

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

server.port=8081
spring.jpa.hibernate.ddl-auto=update

#RabbitMQ configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=user

# Feign Clients - URLs configurables (localhost for local development)
feign.client.turista.url=http://localhost:8082
feign.client.servicio.url=http://localhost:8080

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
