spring.application.name=preferences

# JPA y Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Puerto del servidor
server.port=${SERVER_PORT:8081}

# Datasource SQLite - Usando volumen Docker
spring.datasource.url=jdbc:sqlite:/app/data/iwellness_preferences.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:user}

# Feign Clients - URLs configurables
feign.client.turista.url=${TURISTA_SERVICE_URL:http://admin_users_api:8082}
feign.client.servicio.url=${SERVICIO_SERVICE_URL:http://providers_api:8080}

# Actuator (para health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
